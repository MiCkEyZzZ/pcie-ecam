[book]
title = "PCIe ECAM Host Bridge"
description = "Устройство и реализация host bridge с доступом к configuration space через ECAM"
language = "ru"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/ecam.css"]

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
copy-js = true

[output.html.fold]
enable = false
level = 1
